[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "blindtag"
version = "1.0.0"
description = "Unicode Plane 14 steganographic obfuscation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["steganography", "unicode", "watermarking", "plane14", "encoding"]

dependencies = [
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    # Widget & clipboard
    "customtkinter>=5.2.2",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",       # Required by FastAPI TestClient
    "pytest-cov>=5.0.0",   # Coverage reporting
]

[project.scripts]
blindtag-api    = "blindtag.api:run_server"
blindtag-widget = "blindtag.widget:run_widget"

[tool.setuptools.packages.find]
where = ["."]
include = ["blindtag*"]

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts         = "-v --tb=short"

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source  = ["blindtag"]
omit    = ["blindtag/widget.py"]   # GUI code — exclude from automated coverage

[tool.coverage.report]
show_missing = true
skip_covered = false
