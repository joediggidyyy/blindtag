[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blindtag"
version = "1.0.0"
description = "Unicode Plane 14 steganographic obfuscation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Polymath", email = "dev@polymath-global.com" },
]
keywords = ["steganography", "unicode", "watermarking", "plane14", "encoding"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://polymath-global.com"
Source = "https://github.com/joediggidyyy/blindtag"
Issues = "https://github.com/joediggidyyy/blindtag/issues"
Changelog = "https://github.com/joediggidyyy/blindtag/blob/main/CHANGELOG.md"

dependencies = [
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    # Widget & clipboard
    "customtkinter>=5.2.2",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",       # Required by FastAPI TestClient
    "pytest-cov>=5.0.0",   # Coverage reporting
]

[project.scripts]
blindtag-api    = "blindtag.api:run_server"
blindtag-widget = "blindtag.widget:run_widget"

[tool.setuptools.packages.find]
where = ["."]
include = ["blindtag*"]

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths       = ["tests"]
python_files    = ["test_*.py"]
python_classes  = ["Test*"]
python_functions = ["test_*"]
addopts         = "-v --tb=short"

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source  = ["blindtag"]
omit    = ["blindtag/widget.py"]   # GUI code — exclude from automated coverage

[tool.coverage.report]
show_missing = true
skip_covered = false
